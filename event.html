<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planner</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <style>
        /* ===============================
   GOOGLE FONT
================================== */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    color:#333;
}

/* ===============================
   HEADER
================================== */

header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    text-align:center;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    font-size:16px;
}

/* ===============================
   CONTAINER
================================== */

.container{
    width:95%;
    max-width:1400px;
    margin:30px auto;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
}

/* ===============================
   CARD
================================== */

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.card h2{
    margin-bottom:20px;
    color:#2563eb;
}

/* ===============================
   FORM
================================== */

label{
    display:block;
    margin:12px 0 6px;
    font-weight:500;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    resize:none;
}

form button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

form button:hover{
    background:#1d4ed8;
}

/* ===============================
   CALENDAR
================================== */

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.calendar-header h2{
    margin:0;
    color:#1e40af;
}

.calendar-header button{
    width:40px;
    height:40px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:50%;
    cursor:pointer;
    transition:.3s;
}

.calendar-header button:hover{
    background:#1d4ed8;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    margin-bottom:10px;
}

.weekdays div{
    text-align:center;
    font-weight:600;
    color:#2563eb;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.day{
    height:70px;
    background:#f8f9fc;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.3s;
    font-weight:500;
}

.day:hover{
    background:#2563eb;
    color:white;
}

.today{
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.has-event{
    border:3px solid #16a34a;
}

.empty-day{
    visibility:hidden;
}

/* ===============================
   TODAY EVENTS
================================== */

#todayEvents{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.event-box{
    background:#eef4ff;
    border-left:5px solid #2563eb;
    padding:15px;
    border-radius:8px;
}

.event-box h3{
    color:#1e40af;
    margin-bottom:5px;
}

.event-box p{
    font-size:14px;
}

.empty{
    color:#777;
    text-align:center;
}

/* ===============================
   TABLE
================================== */

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#2563eb;
    color:white;
}

th,
td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tbody tr:hover{
    background:#f3f7ff;
}

/* ===============================
   BUTTONS
================================== */

.delete-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

.delete-btn:hover{
    background:#dc2626;
}

/* ===============================
   FOOTER
================================== */

footer{
    margin-top:20px;
    background:#1e293b;
    color:white;
    text-align:center;
    padding:18px;
}

/* ===============================
   SCROLL TABLE
================================== */

.right-panel{
    overflow-x:auto;
}

/* ===============================
   RESPONSIVE
================================== */

@media(max-width:1000px){

.container{
    grid-template-columns:1fr;
}

}

@media(max-width:768px){

header h1{
    font-size:28px;
}

.card{
    padding:18px;
}

.calendar-grid{
    gap:5px;
}

.day{
    height:55px;
    font-size:14px;
}

th,
td{
    font-size:13px;
    padding:8px;
}

.calendar-header h2{
    font-size:20px;
}

}

@media(max-width:500px){

.weekdays div{
    font-size:12px;
}

.day{
    height:45px;
    font-size:12px;
}

form button{
    font-size:15px;
}

table{
    font-size:12px;
}

}
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <h1>
        <i class="fa-solid fa-calendar-days"></i>
        Event Planner
    </h1>

    <p>Organize your schedule efficiently</p>

</header>

<!-- ================= CONTAINER ================= -->

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <div class="card">

            <h2>
                <i class="fa-solid fa-plus"></i>
                Add Event
            </h2>

            <form id="eventForm">

                <label>Event Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter event title"
                    required>

                <label>Date</label>

                <input
                    type="date"
                    id="date"
                    required>

                <label>Time</label>

                <input
                    type="time"
                    id="time"
                    required>

                <label>Reminder</label>

                <select id="reminder">

                    <option value="No Reminder">
                        No Reminder
                    </option>

                    <option value="10 Minutes Before">
                        10 Minutes Before
                    </option>

                    <option value="30 Minutes Before">
                        30 Minutes Before
                    </option>

                    <option value="1 Hour Before">
                        1 Hour Before
                    </option>

                    <option value="1 Day Before">
                        1 Day Before
                    </option>

                </select>

                <label>Description</label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Enter event details">
                </textarea>

                <button type="submit">
                    <i class="fa-solid fa-calendar-plus"></i>
                    Save Event
                </button>

            </form>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <!-- Calendar -->

        <div class="card">

            <div class="calendar-header">

                <button id="prevMonth">

                    <i class="fa-solid fa-chevron-left"></i>

                </button>

                <h2 id="monthYear">
                    Month Year
                </h2>

                <button id="nextMonth">

                    <i class="fa-solid fa-chevron-right"></i>

                </button>

            </div>

            <div class="weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>

            <div
                id="calendar"
                class="calendar-grid">

            </div>

        </div>

        <!-- Today's Events -->

        <div class="card">

            <h2>

                <i class="fa-solid fa-star"></i>

                Today's Events

            </h2>

            <div id="todayEvents">

                <p class="empty">

                    No events today.

                </p>

            </div>

        </div>

        <!-- All Events -->

        <div class="card">

            <h2>

                <i class="fa-solid fa-list"></i>

                Event List

            </h2>

            <table>

                <thead>

                    <tr>

                        <th>Title</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Reminder</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="eventTable">

                    <!-- JavaScript adds rows -->

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026 Event Planner

        | HTML • CSS • JavaScript

    </p>

</footer>

<!-- ================= SCRIPT ================= -->

<script>
    // ===============================
// EVENT PLANNER
// ===============================

let events = JSON.parse(localStorage.getItem("events")) || [];

let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

const monthYear = document.getElementById("monthYear");
const calendar = document.getElementById("calendar");
const eventForm = document.getElementById("eventForm");

// ===============================
// SAVE EVENTS
// ===============================

function saveEvents() {
    localStorage.setItem("events", JSON.stringify(events));
}

// ===============================
// RENDER CALENDAR
// ===============================

function renderCalendar(month, year) {

    calendar.innerHTML = "";

    const months = [
        "January","February","March","April",
        "May","June","July","August",
        "September","October","November","December"
    ];

    monthYear.innerHTML = months[month] + " " + year;

    let firstDay = new Date(year, month, 1).getDay();

    let daysInMonth = new Date(year, month + 1, 0).getDate();

    // Empty boxes

    for(let i=0;i<firstDay;i++){

        let empty=document.createElement("div");
        empty.className="empty-day";

        calendar.appendChild(empty);

    }

    // Days

    for(let day=1;day<=daysInMonth;day++){

        let box=document.createElement("div");

        box.className="day";

        box.innerHTML=day;

        let fullDate =
            year + "-" +
            String(month+1).padStart(2,"0") +
            "-" +
            String(day).padStart(2,"0");

        // Highlight Today

        let today = new Date();

        if(
            day===today.getDate() &&
            month===today.getMonth() &&
            year===today.getFullYear()
        ){
            box.classList.add("today");
        }

        // Highlight Event Days

        if(events.some(e=>e.date===fullDate)){
            box.classList.add("has-event");
        }

        calendar.appendChild(box);

    }

}

// ===============================
// DISPLAY TABLE
// ===============================

function displayEvents(){

    let table=document.getElementById("eventTable");

    table.innerHTML="";

    events.forEach(function(event,index){

        table.innerHTML += `

        <tr>

            <td>${event.title}</td>

            <td>${event.date}</td>

            <td>${event.time}</td>

            <td>${event.reminder}</td>

            <td>

                <button
                class="delete-btn"
                onclick="deleteEvent(${index})">

                Delete

                </button>

            </td>

        </tr>

        `;

    });

}

// ===============================
// TODAY EVENTS
// ===============================

function showTodayEvents(){

    let container=document.getElementById("todayEvents");

    container.innerHTML="";

    let today=new Date().toISOString().split("T")[0];

    let todayList=events.filter(e=>e.date===today);

    if(todayList.length===0){

        container.innerHTML=
        "<p class='empty'>No events today.</p>";

        return;

    }

    todayList.forEach(function(event){

        container.innerHTML += `

        <div class="event-box">

            <h3>${event.title}</h3>

            <p><strong>Time:</strong> ${event.time}</p>

            <p><strong>Reminder:</strong> ${event.reminder}</p>

            <p>${event.description}</p>

        </div>

        `;

    });

}

// ===============================
// ADD EVENT
// ===============================

eventForm.addEventListener("submit",function(e){

    e.preventDefault();

    let title=document.getElementById("title").value;

    let date=document.getElementById("date").value;

    let time=document.getElementById("time").value;

    let reminder=document.getElementById("reminder").value;

    let description=document.getElementById("description").value;

    events.push({

        title:title,
        date:date,
        time:time,
        reminder:reminder,
        description:description

    });

    saveEvents();

    displayEvents();

    showTodayEvents();

    renderCalendar(currentMonth,currentYear);

    alert("Event Added Successfully!");

    eventForm.reset();

});

// ===============================
// DELETE EVENT
// ===============================

function deleteEvent(index){

    if(confirm("Delete this event?")){

        events.splice(index,1);

        saveEvents();

        displayEvents();

        showTodayEvents();

        renderCalendar(currentMonth,currentYear);

    }

}

// ===============================
// MONTH NAVIGATION
// ===============================

document.getElementById("prevMonth").onclick=function(){

    currentMonth--;

    if(currentMonth<0){

        currentMonth=11;

        currentYear--;

    }

    renderCalendar(currentMonth,currentYear);

};

document.getElementById("nextMonth").onclick=function(){

    currentMonth++;

    if(currentMonth>11){

        currentMonth=0;

        currentYear++;

    }

    renderCalendar(currentMonth,currentYear);

};

// ===============================
// SIMPLE REMINDER CHECK
// ===============================

function checkReminders(){

    let today=new Date().toISOString().split("T")[0];

    events.forEach(function(event){

        if(event.date===today){

            console.log(
                "Reminder:",
                event.title,
                event.time
            );

        }

    });

}

// ===============================
// INITIAL LOAD
// ===============================

renderCalendar(currentMonth,currentYear);

displayEvents();

showTodayEvents();

checkReminders();
</script>

</body>
</html>
